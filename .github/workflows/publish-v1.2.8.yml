name: Publish Quest Targets 1.2.8

on:
  push:
    branches: [codex/publish-v1.2.8]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEMP: ${{ runner.temp }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: simonrath/questtargets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4eebbb22316d33b8d7f8e5275b6e95176a445b27
          persist-credentials: false
      - name: Build and test the reviewed release
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v1.2.8 --json targetCommitish --jq .targetCommitish)" = 4eebbb22316d33b8d7f8e5275b6e95176a445b27
          test "$(gh release view v1.2.8 --json isDraft --jq .isDraft)" = true
          pwsh -NoProfile -File tools/package_quest_targets.ps1
          pwsh -NoProfile -File tools/package_quest_targets.ps1 -CurseForge
          python3 -m venv "$RUNNER_TEMP/release-tests"
          "$RUNNER_TEMP/release-tests/bin/python" -m pip install -r tests/requirements.txt
          "$RUNNER_TEMP/release-tests/bin/python" -m unittest discover -s tests -p 'test_quest_targets*.py'
          (cd dist && sha256sum QuestTargets-1.2.8*.zip > SHA256SUMS.txt)
      - name: Upload verified packages and publish
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v1.2.8 dist/QuestTargets-1.2.8*.zip dist/SHA256SUMS.txt
          test "$(gh release view v1.2.8 --json assets --jq '.assets | length')" = 7
          gh release edit v1.2.8 --draft=false --latest
